name: IdeaRoom GHCR Publish

# Publish the IdeaRoom dorvis fork's runtime image to GHCR so idearoom-agents
# can build its thin AWS Fargate overlay FROM it, instead of re-mirroring this
# entire Dockerfile in idearoom-agents/Dockerfile.hermes. That mirror has
# already drifted once on the tini -> s6-overlay switch; owning the container
# contract here (one place) removes the drift risk. See idearoom Linear AE-38.
#
# This workflow is ADDITIVE to and independent of docker-publish.yml: that one
# is hard-gated to `NousResearch/hermes-agent` and pushes multi-arch to Docker
# Hub, so it never runs on this fork, and upstream merges won't touch this
# IdeaRoom-named file. Here we publish arm64-only to GHCR -- the only consumers
# are AWS Fargate (arm64), the M4 Mac Mini runtime, and idearoom-agents' image
# build, which forces linux/arm64.

on:
  push:
    # No path filter on purpose: idearoom-agents derives its base-image tag
    # from the reference/hermes-agent-dorvis submodule gitlink, so every commit
    # on the carried dorvis/runtime branch must publish a sha-<commit> image or
    # a pin could 404. Keep exactly one automatic publisher for a commit: main
    # may point at the same SHA, and rebuilding there could race an immutable
    # tag with different build output.
    branches: [dorvis/runtime]
  pull_request:
    # PR builds are validation-only (no push). Keep this unfiltered: the image
    # context includes runtime config, plugins, skills, shell scripts, the TUI,
    # and the web app in addition to Python. A hand-maintained path allowlist
    # silently loses coverage whenever that context grows.
    branches: [dorvis/runtime, main]
  # Manual re-arm for a dropped push event. The job condition below limits a
  # dispatch to one of the two trusted integration branch heads and exposes no
  # caller-controlled revision input. Rebuilding an already-published SHA may
  # fail closed on a config-digest mismatch; that leaves the registry untouched.
  workflow_dispatch:
# Key publishing work by the exact push commit so GitHub concurrency cannot
# replace an already-pending main image. PR validation runs still collapse to
# the latest commit for that pull request.
concurrency:
  group: idearoom-ghcr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/idearoom/hermes-agent-dorvis

jobs:
  # PR code is intentionally isolated in a read-only job. A same-repository PR
  # can execute its Dockerfile and smoke-test scripts, so it must never share a
  # job token that can write packages.
  validate-pr:
    if: >-
      github.repository == 'idearoom/hermes-agent-dorvis' &&
      github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate code without retaining credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Resolve validation image identity
        id: image
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          if ! [[ "${revision}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "::error::Checkout did not resolve to a full lowercase Git SHA: ${revision}"
            exit 1
          fi
          if [ "${EVENT_SHA}" != "${revision}" ]; then
            echo "::error::PR event SHA ${EVENT_SHA} does not match checked-out commit ${revision}"
            exit 1
          fi
          {
            echo "revision=${revision}"
            echo "local_image=${IMAGE_NAME}:pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build final validation image (arm64, loaded for smoke test)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.local_image }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.source=https://github.com/idearoom/hermes-agent-dorvis
          build-args: |
            HERMES_GIT_SHA=${{ steps.image.outputs.revision }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ghcr-arm64

      - name: Install uv for docker tests
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0

      - name: Set up Python 3.11 for docker tests
        run: uv python install 3.11

      - name: Install Python dependencies for docker tests
        run: uv sync --locked --python 3.11 --extra dev

      - name: Run docker smoke tests
        env:
          HERMES_TEST_IMAGE: ${{ steps.image.outputs.local_image }}
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: scripts/run_tests.sh tests/docker/test_smoke.py --file-timeout 300 -- -v --tb=short

  build-publish:
    # Only the IdeaRoom fork publishes to its GHCR namespace; a no-op elsewhere
    # (including NousResearch, were this file ever to reach it via a merge).
    if: >-
      github.repository == 'idearoom/hermes-agent-dorvis' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/dorvis/runtime') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/dorvis/runtime' ||
         github.ref == 'refs/heads/main')))
    permissions:
      contents: read
      packages: write
    # Build linux/arm64 through QEMU on the standard hosted pool rather than
    # depending on scarce native arm64 runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
      revision: ${{ steps.image.outputs.revision }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      # Keep the workflow controller separate from the image source so the
      # package-writing phase has an explicit trusted-code boundary.
      - name: Checkout trusted workflow controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .ci-control
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Checkout candidate image source without retaining credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Resolve exact image identity
        id: image
        env:
          EVENT_SHA: ${{ github.sha }}
        working-directory: candidate
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          controller_revision="$(git -C ../.ci-control rev-parse HEAD)"
          if ! [[ "${revision}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "::error::Checkout did not resolve to a full lowercase Git SHA: ${revision}"
            exit 1
          fi
          if [ "${controller_revision}" != "${EVENT_SHA}" ]; then
            echo "::error::Trusted controller ${controller_revision} does not match event SHA ${EVENT_SHA}"
            exit 1
          fi
          if [ "${EVENT_SHA}" != "${revision}" ]; then
            echo "::error::Event SHA ${EVENT_SHA} does not match checked-out commit ${revision}"
            exit 1
          fi
          {
            echo "revision=${revision}"
            echo "local_image=${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "immutable_image=${IMAGE_NAME}:sha-${revision}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # This is the one and only image build. OCI labels and the in-image build
      # SHA are present before it is loaded and smoked. Publishing below tags
      # and pushes this exact local image; it never invokes BuildKit again.
      - name: Build final image (arm64, loaded for smoke test)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: candidate
          file: candidate/Dockerfile
          load: true
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.local_image }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.source=https://github.com/idearoom/hermes-agent-dorvis
          build-args: |
            HERMES_GIT_SHA=${{ steps.image.outputs.revision }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ghcr-arm64
          cache-to: type=gha,mode=max,scope=ghcr-arm64

      - name: Install uv for docker tests
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0

      - name: Set up Python 3.11 for docker tests
        working-directory: candidate
        run: uv python install 3.11

      - name: Install Python dependencies for docker tests
        working-directory: candidate
        run: uv sync --locked --python 3.11 --extra dev

      - name: Run docker smoke tests
        env:
          HERMES_TEST_IMAGE: ${{ steps.image.outputs.local_image }}
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        working-directory: candidate
        run: scripts/run_tests.sh tests/docker/test_smoke.py --file-timeout 300 -- -v --tb=short

      # Everything below pushes -- skipped on pull_request (build + smoke only).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The helper fails closed unless a pre-existing sha-* tag resolves to the
      # same image config digest as the local image. When absent, it pushes the
      # already-smoked local image once, reads the registry manifest back, and
      # exports its distinct registry digest for parent-repo pinning.
      - name: Publish immutable image and attest registry digest
        id: publish
        if: github.event_name != 'pull_request'
        env:
          LOCAL_IMAGE: ${{ steps.image.outputs.local_image }}
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.immutable_image }}
          REVISION: ${{ steps.image.outputs.revision }}
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 -I ../.ci-control/scripts/ci/publish_immutable_image.py \
            --local-image "${LOCAL_IMAGE}" \
            --immutable-image "${IMMUTABLE_IMAGE}" \
            --expected-revision "${REVISION}" \
            --expected-source "https://github.com/idearoom/hermes-agent-dorvis" \
            --artifact-file ghcr-image.json

      - name: Upload immutable image identity
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ghcr-image-${{ steps.image.outputs.revision }}
          path: candidate/ghcr-image.json
          if-no-files-found: error
          retention-days: 30
