name: IdeaRoom GHCR Publish

# Publish the IdeaRoom dorvis fork's runtime image to GHCR so idearoom-agents
# can build its thin AWS Fargate overlay FROM it, instead of re-mirroring this
# entire Dockerfile in idearoom-agents/Dockerfile.hermes. That mirror has
# already drifted once on the tini -> s6-overlay switch; owning the container
# contract here (one place) removes the drift risk. See idearoom Linear AE-38.
#
# This workflow is ADDITIVE to and independent of docker-publish.yml: that one
# is hard-gated to `NousResearch/hermes-agent` and pushes multi-arch to Docker
# Hub, so it never runs on this fork, and upstream merges won't touch this
# IdeaRoom-named file. Here we publish arm64-only to GHCR -- the only consumers
# are AWS Fargate (arm64), the M4 Mac Mini runtime, and idearoom-agents' image
# build, which forces linux/arm64.

on:
  push:
    # No path filter on purpose: idearoom-agents derives its base-image tag
    # from the reference/hermes-agent-dorvis submodule gitlink, so EVERY commit
    # on main must publish a sha-<commit> image or a pin could 404. A no-op
    # build with a warm gha cache is cheap -- the push step just tags existing
    # blobs.
    branches: [main]
  pull_request:
    # PR builds are validation-only (no push), so only run them when the change
    # can actually affect the image. Mirrors docker-publish.yml's filter. The
    # image bakes source via `COPY . .`, hence **/*.py; web/ui-tui- or docs-only
    # PRs skip pre-merge validation and are covered by the unfiltered main build
    # on merge (or a manual workflow_dispatch).
    branches: [main]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/idearoom-ghcr-publish.yml'
      - '.github/actions/hermes-smoke-test/**'
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Exact hermes-agent-dorvis commit to build and publish as sha-<commit>
          (e.g. the reference/hermes-agent-dorvis gitlink idearoom-agents pins).
          Leave blank to publish this branch's HEAD.
        required: false
        type: string

permissions:
  contents: read
  packages: write

# Never cancel a push/dispatch build: idearoom-agents pins the base image by
# `sha-<commit>`, so every commit on main must get its own immutable tag. PR
# runs (build + smoke only, no push) collapse to the latest commit.
concurrency:
  group: idearoom-ghcr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/idearoom/hermes-agent-dorvis

jobs:
  build-publish:
    # Only the IdeaRoom fork publishes to its GHCR namespace; a no-op elsewhere
    # (including NousResearch, were this file ever to reach it via a merge).
    if: github.repository == 'idearoom/hermes-agent-dorvis'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.sha || github.sha }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Build once natively on arm64 and load into the local daemon so the smoke
      # test runs against the exact image before anything is pushed. The push
      # step below is a cache hit on every layer.
      - name: Build image (arm64, for smoke test)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha,scope=ghcr-arm64
          cache-to: type=gha,mode=max,scope=ghcr-arm64

      - name: Smoke test image
        uses: ./.github/actions/hermes-smoke-test
        with:
          image: ${{ env.IMAGE_NAME }}:smoke

      # Everything below pushes -- skipped on pull_request (build + smoke only).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `sha-<full-sha>` on every push/dispatch (immutable -- what idearoom-agents
      # pins to). On a manual dispatch the SHA is the `sha` input when given (so
      # an explicit pin can be backfilled), else the checked-out commit. `latest`
      # only advances on an actual push to main -- never on a manual backfill,
      # which would otherwise point latest at an old commit.
      - name: Compute tags
        id: tags
        if: github.event_name != 'pull_request'
        env:
          TARGET_SHA: ${{ inputs.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:sha-${TARGET_SHA}"
            if [ "${EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push (arm64, cache hit from smoke build)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ inputs.sha || github.sha }}
            org.opencontainers.image.source=https://github.com/idearoom/hermes-agent-dorvis
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=ghcr-arm64
          cache-to: type=gha,mode=max,scope=ghcr-arm64
